<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <script src="js/bootstrap.js"></script>


    <!-- 1. FLOATING CHAT BUTTON (the green circle in the corner) -->
    <button class="chat-fab" id="chatFab" onclick="toggleChat()">

        <!-- Red dot that shows "new message" -->
        <div class="notif-dot" id="notifDot"></div>

        <!-- Chat icon (shown when closed) -->
        <svg class="icon-chat" viewBox="0 0 24 24">
            <path
                d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" />
        </svg>

        <!-- X icon (shown when open) -->
        <svg class="icon-close" viewBox="0 0 24 24">
            <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
    </button>

    <!-- 2. TOOLTIP BUBBLE (appears above the button on load) -->
    <div class="chat-tooltip" id="tooltip">
        👋 Hi! Have questions? We're here to help!
    </div>

    <!-- 3. CHAT WINDOW (hidden until button is clicked) -->
    <div class="chat-window" id="chatWindow">

        <!-- Header bar with name and online status -->
        <div class="chat-header">
            <div class="chat-avatar"><img
                    src="https://tse2.mm.bing.net/th/id/OIP.isN9eXbfXRJSM4_tpmL9GAHaHa?rs=1&pid=ImgDetMain&o=7&rm=3"
                    alt=""></div>
            <div class="chat-header-info">
                <div class="chat-header-name">AI Assistant</div>
                <div class="chat-header-status">
                    <div class="status-dot"></div> Online · Replies instantly
                </div>
            </div>
        </div>

        <!-- Tab switcher: Website Chat vs Facebook -->
        <div class="platform-switch">
            <button class="plat-btn active" id="btnWeb" onclick="switchPlatform('web')">🌐 Website Chat</button>
            <button class="plat-btn" id="btnFb" onclick="switchPlatform('fb')">📘 Facebook</button>
        </div>

        <!-- Website Chat Panel -->
        <div id="webPanel">
            <!-- Lead Generation Form -->
            <div id="onboardingForm" class="onboarding-form">
                <h3>Welcome!</h3>
                <p>Please enter your details to start chatting with us.</p>
                <div class="input-group">
                    <input type="text" id="firstName" placeholder="First Name" required>
                    <input type="text" id="lastName" placeholder="Last Name" required>
                </div>
                <input type="email" id="userEmail" placeholder="Email Address" required>
                <button type="button" class="start-btn" onclick="submitOnboarding()">Start Chatting</button>
            </div>

            <!-- Messages are injected here by JavaScript (initially hidden) -->
            <div class="chat-messages" id="messages" style="display: none;"></div>

            <!-- Text input + send button (initially hidden) -->
            <div class="chat-input-wrap" id="inputWrap" style="display: none;">
                <input class="chat-input" id="chatInput" type="text" placeholder="Type your question..."
                    onkeydown="if(event.key==='Enter') sendMsg()" />
                <button class="send-btn" onclick="sendMsg()">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Facebook Panel (shown when Facebook tab is clicked) -->
        <div class="fb-panel" id="fbPanel">
            <div class="fb-logo">📘</div>
            <h3>Chat on Facebook Messenger</h3>
            <p>Send us a message on our Facebook page.</p>
            <!-- Replace YOUR_PAGE_NAME with the real Facebook page username -->
            <a href="https://m.me/YOUR_PAGE_NAME" class="fb-btn" target="_blank">
                Open Messenger
            </a>
            <div class="fb-hours">
                Mon–Fri · 8:00 AM – 4:00 PM
            </div>

        </div>

    </div> <!-- end chat-window -->
    <script src="js/knowledge.js"></script>
    <script src="js/code.js"></script>
</body>

</html>
